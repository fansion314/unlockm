name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      # notify backends are timing-sensitive; keep the real recursive suites
      # serialized and separate so their failure is attributable in CI logs.
      - run: cargo test --test watch_recursive -- --test-threads=1
      - run: cargo test --test watch_stability -- --test-threads=1
      - run: cargo build --release --locked
