name: Desktop unsigned preview release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package unsigned preview ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            id: macos
            os: macos-latest
            target: universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle/dmg
            build_args: --target universal-apple-darwin --bundles dmg
          - name: Windows x86_64
            id: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_dir: target/x86_64-pc-windows-msvc/release/bundle/nsis
            build_args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' desktop/src-tauri/tauri.conf.json | head -n 1)
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -n 1)
          test "$cargo_version" = "$version"
      # voidzero-dev/setup-vp v1.17.0: installs vp, Node 24, locked-pnpm cache.
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca
        with:
          working-directory: desktop
          node-version: "24"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.id == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Verify formatted Rust source
        run: cargo fmt --all -- --check
      - name: Run strict Rust workspace lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run complete Rust workspace tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Audit bundled Fontsource license resources
        run: cargo test --locked -p unlockm-desktop --test license_audit
      - name: Install locked frontend dependencies
        run: vp -C desktop install --frozen-lockfile
      - name: Validate desktop source
        run: vp -C desktop check
      - name: Test desktop source
        run: vp -C desktop test
      - name: Assert no conversion sidecar or process boundary
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'std::process::Command|Command::new|externalBin|tauri-plugin-shell|sidecar' -- \
            desktop/src-tauri/src desktop/src-tauri/tauri.conf.json desktop/src-tauri/capabilities; then
            echo "UnlockM must link the Rust engine and must not package a conversion sidecar."
            exit 1
          fi
      # tauri-apps/tauri-action action-v1.0.0; its command remains the vp-routed local CLI.
      - name: Build unsigned preview installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          # Tauri's documented ad-hoc identity; no certificate or secret is used.
          APPLE_SIGNING_IDENTITY: ${{ matrix.id == 'macos' && '-' || '' }}
        with:
          projectPath: desktop
          tauriScript: vp exec tauri
          args: ${{ matrix.build_args }}
      - name: Verify macOS ad-hoc preview signature
        if: matrix.id == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          hdiutil verify "$dmg"
          mount_dir=$(mktemp -d "$RUNNER_TEMP/unlockm-preview-dmg.XXXXXX")
          mounted=0
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$mounted" -eq 1 ]; then
              hdiutil detach "$mount_dir" || true
            fi
            rmdir "$mount_dir" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          mounted=1
          app="$mount_dir/UnlockM.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign_details=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$codesign_details" | grep -F "Signature=adhoc"
          test -f "$app/Contents/Resources/licenses/SIL-OFL-1.1.txt"
          test -f "$app/Contents/Resources/licenses/THIRD_PARTY_NOTICES.md"
          executable_count=$(find "$app/Contents/MacOS" -type f -perm -111 | wc -l | tr -d ' ')
          test "$executable_count" -eq 1
          executable=$(find "$app/Contents/MacOS" -type f -perm -111 -print -quit)
          architectures=$(lipo -archs "$executable")
          case "$architectures" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "expected universal x86_64 + arm64 application, got: $architectures"; exit 1 ;;
          esac
          hdiutil detach "$mount_dir"
          mounted=0
          rmdir "$mount_dir"
          trap - EXIT
      - name: Verify Windows unsigned preview app and NSIS installer
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "${{ matrix.bundle_dir }}" -Filter "*-setup.exe")
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS setup executable" }
          $applications = @(Get-ChildItem "target/x86_64-pc-windows-msvc/release" -Filter "*.exe" -File)
          if ($applications.Count -ne 1) { throw "expected exactly one Tauri application executable" }
          foreach ($binary in @($applications[0], $installers[0])) {
            if ((Get-AuthenticodeSignature -FilePath $binary.FullName).Status -ne "NotSigned") {
              throw "preview artifact must be NotSigned: $($binary.FullName)"
            }
          }
      - name: Inspect Windows NSIS payload GUI subsystem, engine, and bundled notices
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeSubsystem([string] $binaryPath) {
            $stream = [IO.File]::Open(
              $binaryPath,
              [IO.FileMode]::Open,
              [IO.FileAccess]::Read,
              [IO.FileShare]::Read
            )
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($stream.Length -lt 64) { throw "PE file is too small: $binaryPath" }
              if ($reader.ReadUInt16() -ne 0x5a4d) {
                throw "DOS MZ header is missing: $binaryPath"
              }
              $stream.Position = 0x3c
              $peOffset = $reader.ReadUInt32()
              if ($peOffset + 24 -gt $stream.Length) {
                throw "PE signature or COFF header is truncated: $binaryPath"
              }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "PE signature is missing: $binaryPath"
              }
              $stream.Position = $peOffset + 20
              $optionalHeaderSize = $reader.ReadUInt16()
              if ($optionalHeaderSize -lt 70) {
                throw "PE optional header is too small: $binaryPath"
              }
              if ($peOffset + 24 + $optionalHeaderSize -gt $stream.Length) {
                throw "PE optional header is truncated: $binaryPath"
              }
              $stream.Position = $peOffset + 24
              $magic = $reader.ReadUInt16()
              if ($magic -ne 0x10b -and $magic -ne 0x20b) {
                throw "unsupported PE optional-header magic $magic in $binaryPath"
              }
              $stream.Position = $peOffset + 24 + 68
              return $reader.ReadUInt16()
            } finally {
              $reader.Dispose()
            }
          }
          $installers = @(Get-ChildItem "${{ matrix.bundle_dir }}" -Filter "*-setup.exe")
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS setup executable" }
          & 7z l $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "7z could not list the NSIS installer" }
          $payload = Join-Path $env:RUNNER_TEMP "unlockm-nsis-payload"
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          & 7z x $installers[0].FullName "-o$payload" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack the NSIS installer" }
          $files = @(Get-ChildItem $payload -Recurse -File)
          $payloadApplications = @($files | Where-Object Name -ieq "unlockm-desktop.exe")
          if ($payloadApplications.Count -ne 1) {
            throw "NSIS payload must contain exactly one unlockm-desktop.exe"
          }
          # IMAGE_SUBSYSTEM_WINDOWS_GUI = 2. A console subsystem (3) creates
          # the black command window reported when the installed app starts.
          $subsystem = Get-PeSubsystem $payloadApplications[0].FullName
          if ($subsystem -ne 2) {
            throw "packaged unlockm-desktop.exe must use IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $subsystem"
          }
          foreach ($notice in "SIL-OFL-1.1.txt", "THIRD_PARTY_NOTICES.md") {
            if (@($files | Where-Object Name -ieq $notice).Count -ne 1) {
              throw "NSIS payload must contain $notice"
            }
          }
          $forbidden = @($files | Where-Object {
            $_.Name -ieq "unlockm.exe" -or $_.Name -match "(?i)^(ffmpeg|ffprobe|.*sidecar.*|.*helper.*)\.exe$"
          })
          if ($forbidden.Count -ne 0) {
            throw "NSIS payload contains a forbidden conversion helper: $($forbidden.FullName -join ', ')"
          }
      - name: Stage macOS universal installer and checksum
        if: matrix.id == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          matches=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#matches[@]}" -eq 1
          asset="UnlockM-${version}-macos-universal-unsigned.dmg"
          cp "${matches[0]}" "release-assets/$asset"
          (
            cd release-assets
            shasum -a 256 "$asset" > "$asset.sha256"
          )
      - name: Stage Windows x86_64 installer and checksum
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installers = @(Get-ChildItem "${{ matrix.bundle_dir }}" -Filter "*-setup.exe")
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS setup executable" }
          $asset = "UnlockM-$version-windows-x64-unsigned-setup.exe"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item $installers[0].FullName "release-assets/$asset"
          $hash = (Get-FileHash "release-assets/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = "$hash  $asset`n"
          [IO.File]::WriteAllText(
            (Join-Path $PWD "release-assets/$asset.sha256"),
            $manifest,
            [Text.Encoding]::ASCII
          )
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: UnlockM-${{ matrix.id }}-release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish unsigned preview prerelease
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          pattern: UnlockM-*-release-assets
          merge-multiple: true
      - name: Verify checksums and exact release contract
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "UnlockM-${version}-macos-universal-unsigned.dmg"
            "UnlockM-${version}-macos-universal-unsigned.dmg.sha256"
            "UnlockM-${version}-windows-x64-unsigned-setup.exe"
            "UnlockM-${version}-windows-x64-unsigned-setup.exe.sha256"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}")
          for checksum in release-assets/*.sha256; do
            if LC_ALL=C grep -q $'\r' "$checksum"; then
              echo "checksum manifest must be ASCII/LF-only: $checksum" >&2
              exit 1
            fi
            (cd release-assets && shasum -a 256 -c "$(basename "$checksum")")
          done
      - name: Create the unsigned preview prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "UnlockM ${GITHUB_REF_NAME} — Unsigned Preview" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes $'Unsigned preview: these artifacts are not notarized or Authenticode-signed. Verify the attached SHA-256 file before opening.\n\nmacOS: after verifying the checksum, use Finder’s per-app Control-click > Open flow if Gatekeeper asks. Do not disable Gatekeeper globally.\n\nWindows: after verifying the checksum, use the per-app SmartScreen prompt only if you trust the preview and its hash. Do not disable SmartScreen globally.\n\nA future signed channel may be added separately.'
      - name: Assert published unsigned preview assets and prerelease state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=$(printf '%s\n' \
            "UnlockM-${version}-macos-universal-unsigned.dmg" \
            "UnlockM-${version}-macos-universal-unsigned.dmg.sha256" \
            "UnlockM-${version}-windows-x64-unsigned-setup.exe" \
            "UnlockM-${version}-windows-x64-unsigned-setup.exe.sha256" | sort)
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = "true"
          test "$(gh release view "$GITHUB_REF_NAME" --json name --jq .name)" = "UnlockM ${GITHUB_REF_NAME} — Unsigned Preview"
          actual=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
