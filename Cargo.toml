[package]
name = "unlockm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fast, safe conversion of encrypted music downloads"
license = "MIT"
repository = "https://git.um-react.app/um/unlockm"

[features]
default = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "6.1"
tempfile = "3.12"
filetime = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
unicode-normalization = "0.1"
lofty = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2.5"
aes = "0.8"
md-5 = "0.10"
url = "2.5"

# These are intentionally pinned to the author's published source revision.  No
# sibling checkout is needed by consumers.
um_audio = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_ncm = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_qmc = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_kgm = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_kuwo = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_xiami = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_xmly = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }
umc_qtfm = { git = "https://git.um-react.app/um/lib_um_crypto_rust", rev = "5dad838c33c3e4aab198d995160d3fbb9968470f" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bench]]
name = "throughput"
harness = false
