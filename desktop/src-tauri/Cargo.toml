[package]
name = "unlockm-desktop"
version = "0.3.2"
edition = "2024"
rust-version = "1.89"
description = "UnlockM desktop application"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
base64 = "=0.23.1"
hex = "=0.4.3"
getrandom = "=0.3.4"
keyring = "=4.1.6"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
unlockm = { path = "../.." }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
base64 = "=0.23.1"
tempfile = "=3.27.0"
